name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      
      - name: Build React app
        run: npm run build
        env:
          CI: false
          REACT_APP_ENV: production
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: build/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: ./build
      
      - name: Deploy to Hostinger VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "build/*"
          target: ${{ secrets.VPS_DEPLOY_PATH }}/build_new
      
      - name: Run deployment script on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            
            echo "📂 Deployment started at $(date)"
            
            # Backup old build
            if [ -d "build" ]; then
              BACKUP_NAME="build_backup_$(date +%Y%m%d_%H%M%S)"
              echo "💾 Creating backup: $BACKUP_NAME"
              mv build "$BACKUP_NAME"
              # Keep only last 3 backups
              ls -t1 build_backup_* 2>/dev/null | tail -n +4 | xargs -r rm -rf
            fi
            
            # Move new build to production
            echo "🚀 Deploying new build"
            mv build_new/build build
            
            # Set proper permissions
            chmod -R 755 build
            chown -R www-data:www-data build 2>/dev/null || true
            
            # Restart web server
            echo "🔄 Restarting services"
            sudo systemctl restart nginx 2>/dev/null || pm2 restart MegaInfoTech-it-consulting 2>/dev/null || true
            
            # Cleanup
            rm -rf build_new
            
            echo "✅ Deployment completed at $(date)"
